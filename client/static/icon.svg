<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1e1e2e"/>
  <!-- Music note pair -->
  <g fill="#818cf8">
    <!-- Beam -->
    <rect x="158" y="130" width="196" height="28" rx="14"/>
    <!-- Left stem -->
    <rect x="158" y="130" width="28" height="190" rx="14"/>
    <!-- Right stem -->
    <rect x="326" y="130" width="28" height="160" rx="14"/>
    <!-- Left note head -->
    <ellipse cx="168" cy="326" rx="54" ry="40" transform="rotate(-15 168 326)"/>
    <!-- Right note head -->
    <ellipse cx="336" cy="296" rx="54" ry="40" transform="rotate(-15 336 296)"/>
  </g>
</svg>
